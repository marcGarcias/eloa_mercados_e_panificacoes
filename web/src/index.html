<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Eloa Mercados &amp; Panificações</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Pães, bolos, doces e salgados feitos diariamente. Faça seu pedido pelo WhatsApp.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Imperial+Script&family=Lora:ital,wght@0,500;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <app-root>
    <style>
      .initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background-color: #F5E9DD;
        z-index: 9999;
        overflow: hidden;
      }
      .initial-loader::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 40%;
        background-color: #CC9148;
        animation: initialLoadingBar 1.2s infinite ease-in-out;
      }
      @keyframes initialLoadingBar {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
    </style>
    <div class="initial-loader"></div>
  </app-root>
</body>
</html>
