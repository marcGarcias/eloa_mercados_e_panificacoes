<section class="view" id="view-conteudo">
                <div class="page-head">
                    <div>
                        <h1>Conteúdo</h1>
                        <p>Textos e informações exibidos no site.</p>
                    </div>
                </div>

                <div class="content-grid">

                    <!-- Comercial -->
                    <div class="content-card">
                        <div>
                            <div class="card-title">Comercial</div>
                            <div class="card-sub">Seção principal exibida no topo do site.</div>
                        </div>
                        <div class="field">
                            <label>Título comercial</label>
                            <input type="text" value="Pães fresquinhos todos os dias.">
                        </div>
                        <div class="field">
                            <label>Texto comercial</label>
                            <textarea rows="3">Doces, bolos, salgados, bebidas e produtos de mercado em um só lugar.</textarea>
                        </div>
                        <div class="content-foot">
                            <button class="btn btn-solid btn-small">Salvar alterações</button>
                        </div>
                    </div>

                    <!-- Sobre -->
                    <div class="content-card">
                        <div>
                            <div class="card-title">Sobre</div>
                            <div class="card-sub">Texto institucional e diferenciais da padaria.</div>
                        </div>
                        <div class="field">
                            <label>Título sobre</label>
                            <input type="text" value="Mais que uma padaria.">
                        </div>
                        <div class="field">
                            <label>Texto sobre</label>
                            <textarea rows="3">Na Eloa Mercados & Panificações acreditamos que pão quentinho é sinônimo de carinho. Produzimos diariamente pães, doces, bolos e salgados sempre buscando qualidade, sabor e atendimento próximo dos nossos clientes.</textarea>
                        </div>
                        <div class="field">
                            <label>Lista de diferenciais</label>
                            <div class="diff-list" id="diff-list"></div>
                            <button class="btn btn-ghost btn-small" id="btn-add-diff" style="margin-top:10px">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round">
                                    <path d="M12 5v14M5 12h14" />
                                </svg>
                                Adicionar diferencial
                            </button>
                        </div>
                        <div class="content-foot">
                            <button class="btn btn-solid btn-small">Salvar alterações</button>
                        </div>
                    </div>

                    <!-- Contato -->
                    <div class="content-card full">
                        <div>
                            <div class="card-title">Contato</div>
                            <div class="card-sub">Horário de funcionamento, endereço e redes sociais.</div>
                        </div>

                        <div class="field">
                            <label>Dias de funcionamento</label>
                            <div class="day-chips" id="day-chips"></div>
                        </div>

                        <div class="field-row">
                            <div class="field">
                                <label>Horário de abertura</label>
                                <input type="time" value="07:00">
                            </div>
                            <div class="field">
                                <label>Horário de fechamento</label>
                                <input type="time" value="19:00">
                            </div>
                        </div>

                        <div class="field">
                            <label>Endereço físico</label>
                            <input type="text" placeholder="Rua, número, bairro, cidade">
                        </div>

                        <div class="field">
                            <label style="margin-bottom:10px">Redes sociais</label>
                        </div>

                        <div class="social-row">
                            <div class="field">
                                <label>WhatsApp</label>
                                <input type="text" placeholder="(11) 94792-5296">
                            </div>
                            <label class="switch">
                                <input type="checkbox" checked>
                                <span class="slider"></span>
                            </label>
                        </div>

                        <div class="social-row">
                            <div class="field">
                                <label>Instagram</label>
                                <input type="text" placeholder="@eloamercados">
                            </div>
                            <label class="switch">
                                <input type="checkbox" checked>
                                <span class="slider"></span>
                            </label>
                        </div>

                        <div class="social-row">
                            <div class="field">
                                <label>Facebook</label>
                                <input type="text" placeholder="facebook.com/eloamercados">
                            </div>
                            <label class="switch">
                                <input type="checkbox">
                                <span class="slider"></span>
                            </label>
                        </div>

                        <div class="content-foot">
                            <button class="btn btn-solid btn-small">Salvar alterações</button>
                        </div>
                    </div>

                </div>
            </section>
