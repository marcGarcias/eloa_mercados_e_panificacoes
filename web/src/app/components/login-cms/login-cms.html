<div class="login-screen">
    <div class="login-card">
        <div class="login-brand">
            <div class="brand-text">Eloa <small>ADMIN</small></div>
            <p>Entre com sua conta para gerenciar o painel.</p>
        </div>
        <form class="login-form">
            <div class="login-error"></div>
            <div class="field">
                <label>Código de acesso</label>
                <input type="text" placeholder="Digite seu codigo de acesso" required>
            </div>
            <div class="field">
                <label>Senha</label>
                <div class="password-field">
                    <input [type]="showPassword ? 'text' : 'password'" placeholder="Digite sua senha" required>
                    <button type="button" class="password-toggle" (click)="togglePassword()" [title]="showPassword ? 'Ocultar senha' : 'Mostrar senha'">
                        @if (showPassword) {
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        } @else {
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                                <line x1="1" y1="1" x2="23" y2="23" />
                            </svg>
                        }
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-solid login-submit">Entrar</button>
        </form>
    </div>
</div>
