<div class="overlay open" id="overlay-usuario">
    <div class="modal">
        <form [formGroup]="userForm" (ngSubmit)="save()">
            <div class="modal-head">
                <h2>{{ user ? 'Editar usuário' : 'Novo usuário' }}</h2>
                <button type="button" class="modal-close" (click)="close()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M18 6L6 18M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="field-row">
                    <div class="field">
                        <label>Nome</label>
                        <input type="text" formControlName="firstName" placeholder="Ex: Renata">
                    </div>
                    <div class="field">
                        <label>Sobrenome</label>
                        <input type="text" formControlName="lastName" placeholder="Ex: Souza">
                    </div>
                </div>
                <div class="field-row">
                    <div class="field">
                        <label>Função</label>
                        <select formControlName="role">
                            <option value="admin">Administrador</option>
                            <option value="editor">Editor</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Senha</label>
                        <div class="password-field">
                            <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Mínimo 8 caracteres">
                            <button type="button" class="password-toggle" (click)="showPassword = !showPassword" title="Mostrar senha">
                                <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" /><circle cx="12" cy="12" r="3" /></svg>
                                <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-foot">
                <button type="button" class="btn btn-ghost" (click)="close()">Cancelar</button>
                <button type="submit" class="btn btn-solid" [disabled]="userForm.invalid">Salvar</button>
            </div>
        </form>
    </div>
</div>
