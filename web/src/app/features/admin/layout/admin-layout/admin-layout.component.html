<div class="app admin-theme">
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand-text">Eloa <small>ADMIN</small></div>
            <nav class="tabs" id="tabs">
                <a class="tab" routerLink="catalog" routerLinkActive="active">Catálogo</a>
                <ng-container *ngIf="authService.currentUser$ | async as user">
                    <!-- Aba Conteúdo: Permitido para SUPER_ADMIN e ADMIN -->
                    <a class="tab" 
                       *ngIf="user.role === 'SUPER_ADMIN' || user.role === 'ADMIN'; else lockedContent" 
                       routerLink="home" 
                       routerLinkActive="active">
                        Conteúdo
                    </a>
                    <ng-template #lockedContent>
                        <span class="tab tab-locked" title="Disponível apenas para Administradores">
                            Conteúdo
                            <svg class="lock-icon" viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                    </ng-template>

                    <!-- Aba Usuários: Permitido apenas para SUPER_ADMIN -->
                    <a class="tab" 
                       *ngIf="user.role === 'SUPER_ADMIN'; else lockedUsers" 
                       routerLink="users" 
                       routerLinkActive="active">
                        Usuários
                    </a>
                    <ng-template #lockedUsers>
                        <span class="tab tab-locked" title="Acesso exclusivo para Super Administrador">
                            Usuários
                            <svg class="lock-icon" viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                    </ng-template>
                </ng-container>
            </nav>
            <div class="account" *ngIf="authService.currentUser$ | async as user">
                <div>
                    <div class="account-name">{{ user.name }}</div>
                    <div class="account-role">{{ RoleTranslations[user.role] }}</div>
                </div>
                <button class="logout-btn" (click)="logout()" title="Sair">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main>
        <router-outlet></router-outlet>
    </main>
</div>

<!-- app-modal-produto removido: agora controlado pelo CatalogoComponent -->
<app-modal-categoria></app-modal-categoria>
