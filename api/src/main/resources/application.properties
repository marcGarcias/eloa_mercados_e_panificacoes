spring.application.name=api
server.port=${PORT:8080}

spring.profiles.active=dev

spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

spring.jackson.time-zone=America/Sao_Paulo
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

spring.jackson.deserialization.fail-on-unknown-properties=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800
jwt.issuer=garcias-api

cookie.secure=false
cookie.same-site=Lax

app.cors.allowed-origins=http://localhost:4200,https://eloa-mercados-e-panificacoes.vercel.app

rate-limit.enabled=true
rate-limit.auth.max-requests=5
rate-limit.auth.window-seconds=60
rate-limit.refresh.max-requests=20
rate-limit.refresh.window-seconds=60
rate-limit.public-endpoint.max-requests=60
rate-limit.public-endpoint.window-seconds=60
rate-limit.admin.max-requests=120
rate-limit.admin.window-seconds=60
rate-limit.default-tier.max-requests=60
rate-limit.default-tier.window-seconds=60
