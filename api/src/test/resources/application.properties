spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

# Redis - use a test-only host that won't be actively connected during module tests
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Disable JPA event publication auto-config from modulith (requires DB schema)
spring.modulith.events.jdbc.schema-initialization.enabled=false

# Disable security auto-configuration where not needed
spring.security.user.name=test
spring.security.user.password=test

# Disable JWT secret requirement for unit context tests
jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1tb2R1bGl0aC10ZXN0cy1vbmx5LXVzYWdl
jwt.expiration=3600000

# COOKIE SETTINGS FOR TESTS
cookie.secure=false
cookie.same-site=Lax
