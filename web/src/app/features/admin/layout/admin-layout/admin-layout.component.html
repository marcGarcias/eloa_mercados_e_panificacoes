<div class="app admin-theme">

    <header class="topbar mobile-only">
        <div class="topbar-inner">
            <div class="brand-logo">Eloa <small>ADMIN</small></div>
            <div class="account-actions" *ngIf="authService.currentUser$ | async as user">
                <div class="user-info-inline">
                    <span class="user-name">{{ user.name }}</span>
                    <span class="user-role">{{ RoleTranslations[user.role] }}</span>
                </div>
                <button class="logout-action-btn" type="button" (click)="logout()" title="Sair da Conta" aria-label="Sair da Conta">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <aside class="sidebar desktop-only">
        <div class="sidebar-brand">
            <div class="brand-logo">Eloa <small>ADMIN</small></div>
        </div>

        <nav class="sidebar-nav" aria-label="Navegação do painel lateral">

            <a class="nav-item" routerLink="catalog" routerLinkActive="active">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="9"></rect>
                    <rect x="14" y="3" width="7" height="5"></rect>
                    <rect x="14" y="12" width="7" height="9"></rect>
                    <rect x="3" y="16" width="7" height="5"></rect>
                </svg>
                <span>Catálogo</span>
            </a>

            <ng-container *ngIf="authService.currentUser$ | async as user">
                <a class="nav-item"
                   *ngIf="user.role === 'SUPER_ADMIN' || user.role === 'ADMIN'; else lockedContentSidebar"
                   routerLink="home"
                   routerLinkActive="active">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20h9"></path>
                        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                    </svg>
                    <span>Conteúdo</span>
                </a>
                <ng-template #lockedContentSidebar>
                    <span class="nav-item locked" title="Disponível apenas para Administradores">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <span>Conteúdo</span>
                    </span>
                </ng-template>

                <a class="nav-item"
                   *ngIf="user.role === 'SUPER_ADMIN'; else lockedUsersSidebar"
                   routerLink="users"
                   routerLinkActive="active">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    <span>Usuários</span>
                </a>
                <ng-template #lockedUsersSidebar>
                    <span class="nav-item locked" title="Acesso exclusivo para Super Administrador">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <span>Usuários</span>
                    </span>
                </ng-template>
            </ng-container>
        </nav>

        <div class="sidebar-footer" *ngIf="authService.currentUser$ | async as user">
            <div class="user-details">
                <div class="user-name">{{ user.name }}</div>
                <div class="user-role">{{ RoleTranslations[user.role] }}</div>
            </div>
            <button class="logout-action-btn" type="button" (click)="logout()" title="Sair da Conta">
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </button>
        </div>
    </aside>

    <div class="app-content-wrapper">
        <main>
            <router-outlet></router-outlet>
        </main>
    </div>

    <nav class="bottom-nav mobile-only" aria-label="Navegação móvel do painel">

        <a class="bottom-nav-item" routerLink="catalog" routerLinkActive="active">
            <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="9"></rect>
                <rect x="14" y="3" width="7" height="5"></rect>
                <rect x="14" y="12" width="7" height="9"></rect>
                <rect x="3" y="16" width="7" height="5"></rect>
            </svg>
            <span>Catálogo</span>
        </a>

        <ng-container *ngIf="authService.currentUser$ | async as user">
            <a class="bottom-nav-item"
               *ngIf="user.role === 'SUPER_ADMIN' || user.role === 'ADMIN'; else lockedContentBottom"
               routerLink="home"
               routerLinkActive="active">
                <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 20h9"></path>
                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                </svg>
                <span>Conteúdo</span>
            </a>
            <ng-template #lockedContentBottom>
                <span class="bottom-nav-item locked" title="Disponível apenas para Administradores">
                    <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <span>Conteúdo</span>
                </span>
            </ng-template>

            <a class="bottom-nav-item"
               *ngIf="user.role === 'SUPER_ADMIN'; else lockedUsersBottom"
               routerLink="users"
               routerLinkActive="active">
                <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                <span>Usuários</span>
            </a>
            <ng-template #lockedUsersBottom>
                <span class="bottom-nav-item locked" title="Acesso exclusivo para Super Administrador">
                    <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <span>Usuários</span>
                </span>
            </ng-template>
        </ng-container>
    </nav>
</div>

<app-modal-categoria></app-modal-categoria>
