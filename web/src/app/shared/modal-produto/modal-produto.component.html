<div
  class="modal-overlay"
  [class.is-open]="isOpen"
  (click)="onOverlayClick($event)"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="modalTitle"
>
  <div class="modal" (click)="$event.stopPropagation()">

    <!-- Cabecalho -->
    <div class="modal-head">
      <h2 class="modal-title">{{ modalTitle }}</h2>
      <button class="modal-close-btn" type="button" (click)="close()" aria-label="Fechar modal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M18 6L6 18M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Corpo -->
    <form class="modal-body" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

      <!-- Nome -->
      <div class="field" [class.has-error]="isFieldInvalid('name')">
        <label for="mp-name">Nome do produto</label>
        <input
          id="mp-name"
          type="text"
          formControlName="name"
          placeholder="Ex: Pao de queijo"
          autocomplete="off"
        />
        <span class="field-error" *ngIf="isFieldInvalid('name')">
          {{ getFieldError('name') }}
        </span>
      </div>

      <!-- Categoria + Peso -->
      <div class="field-row">
        <div class="field" [class.has-error]="isFieldInvalid('categoryId')">
          <label for="mp-category">Categoria</label>
          <select id="mp-category" formControlName="categoryId">
            <option value="" disabled>Selecione...</option>
            <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</option>
          </select>
          <span class="field-error" *ngIf="isFieldInvalid('categoryId')">
            {{ getFieldError('categoryId') }}
          </span>
        </div>

        <div class="field" [class.has-error]="isFieldInvalid('weight')">
          <label for="mp-weight">Peso (kg)</label>
          <input
            id="mp-weight"
            type="number"
            formControlName="weight"
            placeholder="Ex: 0.5"
            step="0.001"
            min="0.001"
          />
          <span class="field-error" *ngIf="isFieldInvalid('weight')">
            {{ getFieldError('weight') }}
          </span>
        </div>
      </div>

      <!-- Foto -->
      <div class="field">
        <label>Foto do produto <span class="field-hint">(formato WebP)</span></label>
        <div class="photo-upload-area">
          <!-- Preview -->
          <div class="photo-preview-box" [class.has-photo]="photoPreviewUrl">
            <img
              *ngIf="photoPreviewUrl"
              [src]="photoPreviewUrl"
              alt="Preview da foto do produto"
              class="photo-preview-img"
              loading="lazy"
            />
            <div class="photo-placeholder" *ngIf="!photoPreviewUrl">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" />
                <circle cx="9" cy="9" r="1.5" />
                <path d="M21 15l-5-5-4 4-2-2-5 5" />
              </svg>
              <span>Sem foto</span>
            </div>
          </div>

          <!-- Controles de upload -->
          <div class="photo-controls">
            <label for="mp-photo-input" class="btn btn-ghost btn-small photo-upload-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 16V4M7 9l5-5 5 5" />
                <path d="M4 20h16" />
              </svg>
              {{ selectedPhoto ? 'Trocar imagem' : 'Enviar imagem' }}
            </label>
            <input
              id="mp-photo-input"
              type="file"
              accept=".webp,image/webp"
              (change)="onPhotoChange($event)"
              hidden
            />

            <span *ngIf="selectedPhoto" class="photo-filename">{{ selectedPhoto.name }}</span>
            <span *ngIf="!selectedPhoto && !photoPreviewUrl" class="photo-filename">Nenhum arquivo selecionado</span>

            <button
              *ngIf="selectedPhoto"
              type="button"
              class="photo-clear-btn"
              (click)="clearPhoto()"
              title="Remover foto selecionada"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M18 6L6 18M6 6l12 12" />
              </svg>
            </button>
          </div>
        </div>
        <span class="field-error" *ngIf="photoError">{{ photoError }}</span>
      </div>

      <!-- Campos exclusivos do modo edicao -->
      <ng-container *ngIf="isEditMode">
        <div class="field-row">

          <!-- Status -->
          <div class="field">
            <label for="mp-status">Status</label>
            <select id="mp-status" formControlName="status">
              <option [value]="ProductStatus.ACTIVE">Ativo</option>
              <option [value]="ProductStatus.INACTIVE">Inativo</option>
            </select>
          </div>

        </div>
      </ng-container>

      <!-- Rodape -->
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" (click)="close()" [disabled]="isSubmitting">
          Cancelar
        </button>
        <button type="submit" class="btn btn-solid" [disabled]="isSubmitting">
          <svg *ngIf="isSubmitting" class="spinner-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
          </svg>
          {{ submitLabel }}
        </button>
      </div>

    </form>
  </div>
</div>
