<div class="users-container" *ngIf="isOwner || true">
  <div class="header-actions">
    <h2>Gerenciar Usuários</h2>
    <button class="btn-primary" *ngIf="isOwner">Novo Usuário</button>
  </div>
  
  <div class="table-responsive">
    <table class="users-table">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Código</th>
          <th>Função</th>
          <th>Status</th>
          <th>Último Acesso</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td>{{ user.name }}</td>
          <td>{{ user.code }}</td>
          <td>{{ user.role }}</td>
          <td><span class="status-badge" [class.active]="user.status === 'Ativo'">{{ user.status }}</span></td>
          <td>{{ user.lastAccess }}</td>
          <td>
            <button class="btn-icon" *ngIf="canEditUser(user)" (click)="openEditModal(user)">
              <!-- Edit Icon -->
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Edit Modal -->
<app-modal [title]="'Editar Usuário'" [isOpen]="isEditModalOpen" (close)="isEditModalOpen = false">
  <div class="form-group">
    <label>Nome</label>
    <input type="text" [(ngModel)]="editingUser.name" [disabled]="!isOwner">
  </div>
  
  <div class="form-group password-group">
    <label>Senha</label>
    <div class="input-wrapper">
      <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="editingUser.password" placeholder="*****">
      <button class="toggle-pwd" (click)="togglePassword()">
         {{ showPassword ? 'Ocultar' : 'Mostrar' }}
      </button>
    </div>
  </div>
  
  <div class="form-group" *ngIf="isOwner && editingUser.id !== currentUser?.id">
    <label>Função</label>
    <select [(ngModel)]="editingUser.role">
      <option value="Admin">Admin</option>
      <option value="Editor">Editor</option>
    </select>
  </div>
  
  <div class="form-group" *ngIf="isOwner && editingUser.id !== currentUser?.id">
    <label>Status</label>
    <select [(ngModel)]="editingUser.status">
      <option value="Ativo">Ativo</option>
      <option value="Inativo">Inativo</option>
    </select>
  </div>
  
  <div class="modal-actions">
    <button class="btn-delete" *ngIf="isOwner && editingUser.id !== currentUser?.id" (click)="openDeleteModal(editingUser!)">Excluir Perfil</button>
    <div class="spacer"></div>
    <button class="btn-secondary" (click)="isEditModalOpen = false">Cancelar</button>
    <button class="btn-primary" (click)="saveUser()">Salvar</button>
  </div>
</app-modal>

<!-- Delete Modal -->
<app-modal [title]="'Confirmar Exclusão'" [isOpen]="isDeleteModalOpen" (close)="isDeleteModalOpen = false">
  <div class="alert alert-danger">
    <p>Para excluir o usuário <strong>{{ userToDelete?.name }}</strong>, digite o nome do usuário e sua senha de Owner.</p>
  </div>
  
  <div class="form-group">
    <label>Nome do Usuário</label>
    <input type="text" [(ngModel)]="deleteUsernameConfirm" placeholder="Nome do usuário a deletar">
  </div>
  
  <div class="form-group">
    <label>Sua Senha (Owner)</label>
    <input type="password" [(ngModel)]="deleteOwnerPasswordConfirm" placeholder="Sua senha">
  </div>
  
  <div class="modal-actions">
    <button class="btn-secondary" (click)="isDeleteModalOpen = false">Cancelar</button>
    <button class="btn-danger" (click)="confirmDelete()" [disabled]="deleteUsernameConfirm !== userToDelete?.name || !deleteOwnerPasswordConfirm">Confirmar Exclusão</button>
  </div>
</app-modal>
