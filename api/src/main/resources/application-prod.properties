# DATABASE - POSTGRESQL PRODUCAO (RENDER)
# A Render fornece PGHOST, PGPORT, PGDATABASE, PGUSER e PGPASSWORD automaticamente
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# REDIS PRODUCAO (RENDER)
spring.data.redis.url=${REDIS_URL:}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# JPA / HIBERNATE PROD
spring.jpa.show-sql=false

# Setup Initial (No fallback in prod)
app.setup.access-key=${SETUP_ACCESS_KEY}
app.setup.cpf=${SETUP_CPF}

# LOGGING PROD
logging.level.root=WARN
logging.level.garcias.api=INFO

# JWT PROD
jwt.secret=${JWT_SECRET}

# COOKIES PROD
cookie.secure=true
cookie.same-site=None
